<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#05030f">
  <meta name="robots" content="noindex, follow">
  <title>AI 规则助手 | NEON PLINKO 霓虹弹珠</title>
  <meta name="description" content="NEON PLINKO 霓虹弹珠的独立 AI 规则助手，由 Firebase AI Logic 与 Gemini 提供，回答玩法、倍率、下注与操作问题。">
  <style>
    :root {
      color-scheme: dark;
      --bg: #05030f;
      --panel: #0b0720;
      --pink: #ff3cac;
      --cyan: #00e5ff;
      --text: #e8e4ff;
      --muted: #a8a2c8;
      --border: rgba(255, 60, 172, 0.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px 48px;
      background: radial-gradient(circle at 50% -10%, #1b0b3a 0%, var(--bg) 60%);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, "Microsoft YaHei", sans-serif;
      line-height: 1.6;
    }
    a { color: var(--cyan); }
    .skip {
      position: absolute;
      left: -9999px;
      top: 0;
      padding: 10px 16px;
      background: #fff;
      color: #000;
      z-index: 10;
    }
    .skip:focus { left: 16px; top: 16px; }
    .wrap { width: min(760px, 100%); margin: 0 auto; }
    header { padding: 16px 0 24px; border-bottom: 1px solid var(--border); }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-decoration: none;
      color: var(--text);
    }
    .brand b { color: var(--pink); }
    .kicker { margin: 18px 0 4px; color: var(--cyan); font-size: 12px; letter-spacing: 0.22em; }
    h1 { margin: 0; font-size: clamp(28px, 6vw, 44px); line-height: 1.15; }
    h1 span { color: var(--pink); }
    .lede { margin: 12px 0 0; color: var(--muted); max-width: 60ch; }
    main { padding-top: 28px; }
    .card {
      background: rgba(11, 7, 32, 0.88);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 0 36px rgba(255, 60, 172, 0.12);
    }
    label { display: block; font-weight: 700; margin-bottom: 8px; }
    textarea {
      width: 100%;
      min-height: 104px;
      resize: vertical;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(0, 229, 255, 0.35);
      background: #060312;
      color: var(--text);
      font: inherit;
    }
    textarea:focus-visible, button:focus-visible, a:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; align-items: center; }
    button {
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      border-radius: 10px;
      padding: 11px 20px;
      border: 1px solid transparent;
    }
    .primary {
      background: linear-gradient(90deg, var(--cyan), var(--pink));
      color: #06030f;
    }
    .primary:disabled { opacity: 0.6; cursor: wait; }
    .ghost {
      background: transparent;
      color: var(--text);
      border-color: rgba(168, 162, 200, 0.45);
    }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 0; }
    .chips button {
      padding: 7px 13px;
      font-size: 13px;
      background: rgba(0, 229, 255, 0.08);
      color: var(--cyan);
      border-color: rgba(0, 229, 255, 0.3);
    }
    .status { min-height: 1.6em; margin: 16px 0 0; color: var(--cyan); font-size: 14px; }
    .answer {
      margin-top: 12px;
      min-height: 1.6em;
      padding: 16px;
      border-radius: 12px;
      background: #060312;
      border: 1px solid rgba(168, 162, 200, 0.22);
      white-space: pre-wrap;
    }
    .answer:empty { display: none; }
    .note { margin-top: 18px; color: var(--muted); font-size: 13px; }
    footer {
      margin-top: 36px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <a class="skip" href="#main">跳到主要内容</a>
  <div class="wrap">
    <header>
      <a class="brand" href="./"><b>NEON</b> PLINKO</a>
      <p class="kicker">FIREBASE AI LOGIC // GEMINI</p>
      <h1>AI <span>规则助手</span></h1>
      <p class="lede">只回答 NEON PLINKO 霓虹弹珠的玩法、倍率、下注、操作与规则问题。由 Firebase AI Logic 调用 Gemini 生成，纯娱乐游戏，不涉及真实货币。</p>
    </header>

    <main id="main">
      <section class="card" aria-labelledby="ask-title">
        <h2 id="ask-title" style="margin-top:0;font-size:18px">向 AI 提问</h2>
        <form id="ask-form">
          <label for="question">你的问题</label>
          <textarea id="question" name="question" maxlength="500" autocomplete="off" placeholder="例如：最高倍率是多少？怎么在手机上投放？"></textarea>
          <div class="actions">
            <button class="primary" id="submit" type="submit">询问 AI 助手</button>
            <a class="ghost" href="./" style="text-decoration:none;display:inline-block;padding:11px 20px;border-radius:10px;border:1px solid rgba(168,162,200,.45)">返回游戏</a>
          </div>
        </form>
        <div class="chips" aria-label="推荐问题">
          <button type="button" data-suggest="NEON PLINKO 的 9 个倍率槽分别是什么？">倍率表</button>
          <button type="button" data-suggest="游戏怎么开始？键盘和手机分别怎么操作？">操作方式</button>
          <button type="button" data-suggest="下注档位有哪些？初始筹码和胜利目标是多少？">下注与目标</button>
          <button type="button" data-suggest="这个游戏涉及真实货币或充值吗？最高纪录保存在哪里？">安全说明</button>
        </div>
        <p class="status" id="status" role="status" aria-live="polite"></p>
        <div class="answer" id="answer" aria-live="polite"></div>
        <p class="note">本页面会把你的问题发送给 Google Gemini 以生成回答，请勿输入个人信息。AI 回答可能有误，游戏内规则以主页说明为准。</p>
      </section>
    </main>

    <footer>
      <p>NEON PLINKO · 独立 AI 助手页 · 不参与主站 SEO 评分 · <a href="./llms.txt">llms.txt</a></p>
    </footer>
  </div>

  <noscript><p style="color:#fff">需要启用 JavaScript 才能使用 AI 助手。</p></noscript>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js';
    import { getAI, getGenerativeModel, GoogleAIBackend } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-ai.js';
    import { firebaseConfig } from './firebase-config.js';

    const form = document.getElementById('ask-form');
    const input = document.getElementById('question');
    const submit = document.getElementById('submit');
    const statusEl = document.getElementById('status');
    const answerEl = document.getElementById('answer');

    // 2026-11 验证可用的稳定模型；gemini-3.8-flash 当时持续高负载，故不作为首选。
    const MODELS = ['gemini-3.5-flash-lite', 'gemini-3.6-flash', 'gemini-3.5-flash'];
    const TIMEOUT_MS = 35000;
    const SYSTEM = '你是「NEON PLINKO 霓虹弹珠」的官方规则助手。只回答与这个游戏相关的问题，包括：玩法步骤、9 个倍率槽（x12 / x4 / x1.5 / x0.5 / x0.25 / x0.5 / x1.5 / x4 / x12）、下注档位（10 / 25 / 50 / 100 / 250 CR）、初始 1,000 CR、目标 10,000 CR、键盘与触屏操作、最高纪录保存在浏览器 localStorage、纯娱乐且无真实货币投注。请用简体中文、简短、纯文本回答，不要使用 Markdown，不要编造未提供的信息。如果问题与游戏无关，请礼貌拒答并引导用户回到游戏。';

    let ai;
    try {
      const app = initializeApp(firebaseConfig);
      ai = getAI(app, { backend: new GoogleAIBackend() });
      statusEl.textContent = '已连接，请输入问题。';
    } catch (err) {
      statusEl.textContent = 'Firebase 初始化失败：' + (err && err.message ? err.message : String(err));
      submit.disabled = true;
    }

    function setBusy(busy) {
      submit.disabled = busy || !ai;
      submit.textContent = busy ? '思考中…' : '询问 AI 助手';
      if (busy) statusEl.textContent = '正在连接 Gemini，请稍候…';
    }

    function withTimeout(promise, ms) {
      let timer;
      return Promise.race([
        promise,
        new Promise((_, reject) => {
          timer = setTimeout(() => reject(new Error('请求超时，请重试')), ms);
        })
      ]).finally(() => clearTimeout(timer));
    }

    function extractText(response) {
      if (!response) return '';
      let text = '';
      try {
        if (typeof response.text === 'function') text = response.text();
        else if (typeof response.text === 'string') text = response.text;
      } catch (_) {}
      if (!text && response.candidates && response.candidates[0]) {
        const parts = response.candidates[0].content && response.candidates[0].content.parts;
        if (Array.isArray(parts)) text = parts.map(p => p && p.text ? p.text : '').join('');
      }
      return text;
    }

    async function ask(question) {
      if (!ai) return;
      setBusy(true);
      answerEl.textContent = '';
      let lastError = '';
      for (const name of MODELS) {
        try {
          const model = getGenerativeModel(ai, { model: name, generationConfig: { maxOutputTokens: 300, temperature: 0.4 } });
          const result = await withTimeout(model.generateContent(SYSTEM + '\n\n用户问题：' + question), TIMEOUT_MS);
          const text = extractText(result && result.response);
          answerEl.textContent = text.trim() || '（AI 返回了空内容，请重试）';
          statusEl.textContent = '回答完成。';
          setBusy(false);
          return;
        } catch (err) {
          lastError = err && (err.message || err.code) ? (err.message || err.code) : String(err);
        }
      }
      answerEl.textContent = '暂时无法连接 AI 助手。可能是模型临时高负载、API Key 域名限制或免费额度不足；页面已自动尝试多个稳定模型，请稍后重试。\n\n错误详情：' + lastError;
      statusEl.textContent = '请求失败。';
      setBusy(false);
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const q = input.value.trim();
      if (!q) { statusEl.textContent = '请先输入问题。'; return; }
      ask(q);
    });

    document.querySelectorAll('[data-suggest]').forEach(btn => {
      btn.addEventListener('click', () => {
        const q = btn.getAttribute('data-suggest');
        input.value = q;
        input.focus();
        ask(q);
      });
    });
  </script>
</body>
</html>
